name: Deploy to Firebase

on:
  repository_dispatch:
    types: [deploy-dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nohomework-productions
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refactor_CMS
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build -- --no-lint
        env:
          NEXT_PUBLIC_ENV: development
        
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.DEV_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: nhpwebsite-dev
