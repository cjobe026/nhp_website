name: Deploy to Firebase

on:
  repository_dispatch:
    types: [deploy-dev, deploy-prod]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

jobs:
  build-and-deploy-dev:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' || github.event.action == 'deploy-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refactor_CMS
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENV: development
        
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.DEV_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: nhpwebsite-dev

  build-and-deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' || github.event.action == 'deploy-prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refactor_CMS
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENV: production
        
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.PROD_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: nhpwebsite
